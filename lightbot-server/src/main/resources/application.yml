server:
  port: 8081

spring:
  main:
    allow-circular-references: true
  application:
    name: lightbot
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  autoconfigure:
    exclude:
      # Chat 由 ModelFactory 按数据库配置动态创建，禁用全局自动装配
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

  # ========================================
  # PostgreSQL 数据库配置
  # 驱动：org.postgresql.Driver
  # 需要安装 pgvector 扩展用于向量存储
  # 本机开发凭证直接配置于此文件。
  # ========================================
  datasource:
    url: jdbc:postgresql://localhost:5432/lightbot
    username: 'postgres'
    password: 'postgres'
    driver-class-name: org.postgresql.Driver

  # ========================================
  # 只读数据源（供 PgSqlTool 等执行用户 SQL 的工具使用）
  # 限定权限：仅 SELECT，无 DML/DDL，避免 SQL 注入风险扩散
  # 未配置时回退到主 datasource
  # ========================================
  datasource-readonly:
    url: jdbc:postgresql://localhost:5432/lightbot
    username: 'postgres'
    password: 'postgres'
    driver-class-name: org.postgresql.Driver

  # ========================================
  # Redis 配置（用于缓存、会话等）
  # ========================================
  data:
    redis:
      host: 'localhost'
      port: '6379'
      password: '123456'
      database: '9'

  # ========================================
  # SpringAI 模型配置
  # api-key 直接配置于此文件。
  # Chat 模型由 ModelFactory 按数据库 model_provider 动态创建；
  # 此处配置供 Embedding 默认值及 OpenAIModelHandler 参考。
  # ========================================
  ai:
    dashscope:
      api-key: sk-c0dcee1f2bae4555aaef62f4193829d4
      chat:
        options:
          model: qwen-plus
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini

# ========================================
# MyBatis-Plus 配置
# type-enums-package：枚举类包路径，自动映射枚举值
# default-enum-type-handler：MyBatis-Plus 枚举处理器
# map-underscore-to-camel-case：下划线转驼峰
# ========================================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-enums-package: com.lightbot.enums
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ========================================
# Sa-Token 认证配置
# 官方文档：https://sa-token.cc
# token-name：前端传递 Token 的请求头名称
# timeout：Token 有效期（秒），默认86400（24小时）
# active-timeout：Token 最长无操作时间（秒），-1表示不限
# is-concurrent：是否允许同一账号并发登录
# is-share：多人登录同一账号时是否共用同一个 Token
# token-style：Token 样式（uuid/simple-uuid/random-32 等）
# ========================================
sa-token:
  token-name: Authorization
  timeout: 604800
  active-timeout: 86400
  active-timeout-check: true
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false
  is-read-param: true
  # Redis 配置：session 持久化到 Redis，重启不丢失
  redis:
    key-prefix: 'sa-token:'
    database: 0

# ========================================
# MinIO 对象存储配置
# 官方文档：https://min.io
# endpoint：MinIO 服务地址（本地默认 9000 端口）
# access-key / secret-key：MinIO 访问凭证。
# bucket：存储桶名称，首次使用时自动创建
# ========================================
minio:
  endpoint: 'http://localhost:9000'
  access-key: 'minioadmin'
  secret-key: 'minioadmin'
  bucket: 'lightbot'

# ========================================
# Neo4j 图数据库配置（知识图谱）
# uri：Bolt 协议地址
# username / password：认证凭证。
# ========================================
neo4j:
  uri: 'bolt://localhost:7687'
  username: 'neo4j'
  password: 'neo4j123'

# 系统配置
lightbot:
  # 自动化定时任务（分钟级扫描，降低 DB 负担）
  automation:
    scan-interval-ms: 60000
    scan-initial-delay-ms: 45000
    scan-batch-size: 20
    reclaim-interval-ms: 300000
    reclaim-initial-delay-ms: 120000
    reclaim-batch-size: 50
    execute-pool-size: 2
  dify:
    # Base64 编码的 32 字节 AES 密钥；生产环境必须通过环境变量注入。
    encryption-key: ${LIGHTBOT_DIFY_ENCRYPTION_KEY:}
    encryption-key-version: v1
    connect-timeout-seconds: 3
    read-timeout-seconds: 15
# ========================================
# OCR 配置（RapidOCR）
# enabled：是否启用 OCR 功能
# model-path：模型存放路径（仅用于健康检查展示，实际使用内置 PP-OCRv4 模型）
# auto-download：是否自动下载（内置模型无需下载，此配置预留）
# ========================================
  ocr:
    enabled: false
    model-path: ${OCR_MODEL_PATH:models/RapidOCR/PP-OCRv4}
    auto-download: true
  task:
    consumer:
      # 默认组（短任务）worker 数量
      pool-size: 2
      # 重型组（图谱抽取、问答对生成）worker 数量
      heavy-pool-size: 1
    # 僵尸消息监控（仅告警，不主动 XCLAIM；崩溃兜底由 PEL 共享 + ID-0 双拉实现）
    reclaim:
      interval-seconds: 30
      stale-threshold-minutes: 5
      batch-size: 100
    # 延迟队列扫描（重试退避任务到期重投主 Stream）
    delay:
      interval-seconds: 1
      batch-size: 100
    # 重试策略：按 TaskType 配置；未配置的类型回落到 default
    retry:
      default-policy:
        max-attempts: 3
        backoff-base-ms: 5000
        backoff-multiplier: 2.0
        backoff-max-ms: 600000
      overrides:
        GRAPH_EXTRACTION:
          max-attempts: 2
          backoff-base-ms: 30000
          backoff-multiplier: 2.0
          backoff-max-ms: 600000
        QA_PAIR_GENERATE:
          max-attempts: 2
          backoff-base-ms: 10000
        RAG_EVALUATION:
          max-attempts: 1
    # ========================================
    # 僵尸任务扫描器
    # 周期扫描 status=RUNNING 但 update_time 已超时的任务：
    #   streamId 仍在 PEL → worker 可能还在跑，跳过
    #   streamId 不在 PEL → 确认孤儿，CAS markFailed + 回滚 Document
    # ========================================
    zombie:
      # 扫描周期（秒）
      interval-seconds: 60
      # 默认超时阈值（分钟）：超过此值且 streamId 不在 PEL 才视为孤儿
      default-timeout-minutes: 10
      # 单次扫描上限，避免一次性处理过多任务
      batch-size: 100
      # 按 TaskType 覆盖的超时阈值（分钟），未配置的类型回落到 default
      overrides:
        GRAPH_EXTRACTION: 60
        QA_PAIR_GENERATE: 30
        RAG_EVALUATION: 20
  # ========================================
  # Milvus 向量数据库配置
  # enabled：是否启用 Milvus（未部署时设为 false）
  # uri：Milvus 服务地址
  # token：认证令牌（standalone 模式默认为空）
  # ========================================
  milvus:
    enabled: 'true'
    uri: 'http://localhost:19530'
    token: ''
    connect-timeout-ms: 10000
    wait-timeout-ms: 30000
  # ========================================
  # 日志 TTL 清理配置
  # retention-days：日志保留天数，早于此天数的数据将被物理删除
  #   作用于：llm_trace、workflow_test_run（无界增长的日志类表）
  #   设为 0 或负数可禁用清理（不建议长期禁用，会撑爆磁盘）
  # 清理任务由 LogCleanupJob 每天 02:03 触发
  # ========================================
  log-cleanup:
    retention-days: 30

# ========================================
# 内置工具 API Key 配置
# ========================================
  # GitHub API Token（可选，提升 API 速率限制，Code Search API 必需）
  # 获取地址：https://github.com/settings/tokens → Fine-grained tokens
  github:
    token: ${GITHUB_TOKEN:}
  # Tavily 联网搜索 API Key
  # 获取地址：https://tavily.com → API Keys
  # 环境变量：TAVILY_API_KEY
  tavily:
    api-key: ${TAVILY_API_KEY:}
  # SiliconFlow AI 生图 API Key
  # 获取地址：https://siliconflow.cn → API Keys
  # 环境变量：SILICONFLOW_API_KEY
  siliconflow:
    api-key: ${SILICONFLOW_API_KEY:}




# ========================================
# SpringDoc / Swagger 配置
# 访问地址：http://localhost:8080/swagger-ui.html
# ========================================
springdoc:
  # 生产环境请改为 false 禁用 Swagger UI 和 API Docs
  enabled: 'true'
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
